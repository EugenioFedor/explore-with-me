spring.application.name=ewm-service
server.port=8080
# ???? ??????
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ewm}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
# ???????????
logging.level.ru.practicum=DEBUG
logging.level.org.springframework.web=INFO
stats-server.url=${STATS_SERVER_URL:http://localhost:9090}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always